
openapi: 3.0.0

info:
  title: Addition API
  version: 1.0.0

servers:
  - url: http://localhost:8080

paths:
  /add:
    get:
      summary: Add two numbers
      parameters:
        - name: a
          in: query
          required: true
          schema:
            type: integer

        - name: b
          in: query
          required: true
          schema:
            type: integer

      responses:
        '200':
          description: Successful response
          content:
            text/plain:
              schema:
                type: string
              example: "Addition = 15"
